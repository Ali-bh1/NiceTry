<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360" />
  <title>NiceTry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 520px;
      background: #0a0e1a;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-y: auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #2a3050;
      background: linear-gradient(135deg, #111827, #1a1f35);
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; }
    .header-text h1 { font-size: 14px; font-weight: 700; }
    .header-text p { font-size: 10px; color: #64748b; }

    /* ── Status Section ── */
    .status {
      padding: 16px;
      text-align: center;
    }
    .status-idle { color: #94a3b8; font-size: 13px; }

    /* ── Result Card ── */
    .result {
      padding: 16px;
    }
    .verdict-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .verdict-safe { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    .verdict-suspicious { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); }
    .verdict-phishing { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }

    .risk-score {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .risk-safe { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 2px solid #10b981; }
    .risk-caution { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 2px solid #f59e0b; }
    .risk-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 2px solid #ef4444; }

    .verdict-text h2 { font-size: 14px; font-weight: 700; }
    .verdict-text p { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    /* ── Detail Rows ── */
    .details {
      background: #111827;
      border: 1px solid #2a3050;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1e2540;
      font-size: 11px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #64748b; }
    .detail-value { color: #e2e8f0; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 11px; }

    /* ── Narrative ── */
    .narrative {
      background: #111827;
      border: 1px solid #2a3050;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .narrative h3 { font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    .narrative p { font-size: 12px; line-height: 1.6; color: #cbd5e1; }

    /* ── Buttons ── */
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-scan {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .btn-dashboard {
      background: #1a1f35;
      color: #94a3b8;
      border: 1px solid #2a3050;
    }
    .btn-dashboard:hover { border-color: #3b82f6; color: #60a5fa; }

    /* ── Footer ── */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #2a3050;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: #64748b;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      color: #94a3b8;
      font-size: 13px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #2a3050;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>NiceTry</h1>
      <p>7-Layer AI Detection</p>
    </div>
  </div>

  <!-- Content -->
  <div id="content">
    <div class="status">
      <p class="status-idle">Analyzing current page...</p>
      <div class="loading"><div class="spinner"></div>Loading</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-status">
      <div class="dot"></div>
      <span>Pipeline Active</span>
    </div>
    <span style="font-size:10px; color:#475569;">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
